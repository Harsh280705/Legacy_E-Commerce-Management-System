name: legacyecommerce

# Isolated project: own network + own persistent volume. Nothing here touches
# other compose projects. Host port 8085 verified free on 2026-10-11.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: legacyecommerce-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MSSQL_PID: Developer
    volumes:
      - legacyecommerce_mssql_data:/var/opt/mssql
    networks:
      - legacyecommerce_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -l 5 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12

  dbinit:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: legacyecommerce-dbinit
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      SEED_SIZE: ${SEED_SIZE:-100}
    volumes:
      - ./db/schema.sql:/db/schema.sql:ro
      - ./db/seed.sql:/db/seed.sql:ro
      - ./db/seed_1000.sql:/db/seed_1000.sql:ro
      - ./db/init.sh:/db/init.sh:ro
    networks:
      - legacyecommerce_net
    entrypoint: ["/bin/sh", "/db/init.sh"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        MONO_TAG: "6.12"
    image: legacyecommerce-web:1.0
    container_name: legacyecommerce-web
    depends_on:
      dbinit:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: "1433"
      DB_NAME: LegacyEcommerceDb
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Optional. When both are set, the web app provisions an "Admin" role and
      # this user at start-up so /Admin is reachable. Leave unset for public
      # deployments: no administrator account is created at all.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - legacyecommerce_net
    restart: unless-stopped
    # Internal port only — public traffic goes through nginx.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 8

  nginx:
    image: nginx:1.27-alpine
    container_name: legacyecommerce-nginx
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
    networks:
      - legacyecommerce_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health | grep -q OK || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  legacyecommerce_net:
    name: legacyecommerce_net
    driver: bridge

volumes:
  legacyecommerce_mssql_data:
    name: legacyecommerce_mssql_data
