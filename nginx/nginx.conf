upstream web_app {
    server web:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;
    proxy_read_timeout 120s;

    # Static assets: proxy to XSP (Mono serves them); cache briefly.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        proxy_pass http://web_app;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web_app;
        # $http_host preserves the original host AND port (localhost:8085) so
        # MVC/OWIN redirects and ReturnUrl values stay reachable.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cookie_path / /;
        proxy_redirect off;

        # Friendly error if the MVC app is down (never leak container names).
        proxy_next_upstream error timeout http_502 http_503;
        proxy_intercept_errors on;
        error_page 502 503 504 /maintenance.html;
    }

    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Nginx health (for compose healthcheck).
    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
